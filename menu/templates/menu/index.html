{% load static %}
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Menu des Burgers</title>
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
  </head>
  <body>
    <img src="{% static 'menu/images/logo.png' %}" alt="Logo du restaurant" class="Logo">


    <h1>Les Burgers</h1>

    <ul>
        {% for burger in burgers %}
        <li>{{ burger.nom }} : {{ burger.prix }}€</li>
        {% endfor %}
    </ul>

  </body>
</html>
